automation:
  methods:
    - method: "agent"
      models:
        - "Claude Opus 5.5"
      framework: "Claude Code"
  notes: >-
    Claude Code reproduced the computations of the paper, found the parity invariant and the exhaustive check, wrote
    all of the Lean code and drafted these metadata. The human author directed the work and is responsible for the
    submission.

review:
  status: "unchecked"
  notes: >-
    No separate human review of the Lean code has been made before submission. Mechanical checks: a build without
    warnings other than the placeholders of Challenge.lean, and the axioms of the four results are propext,
    Classical.choice and Quot.sound.

status:
  scope: >-
    The exact length, in degrees 44 and 52, of two given seven-element representatives. Degree 51, the third open degree of
    the paper, and lifts to larger degrees are not treated.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - description: "In degree 44 the length modulo D_44 + S_44 is seven."
      declaration: "FermatLength.lenMod_xi44"
      file: "FermatLength/Deg44.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - description: "The same in degree 44 modulo the larger subgroup."
      declaration: "FermatLength.lenMod_xi44_all"
      file: "FermatLength/Deg44.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - description: "In degree 52 the length modulo D_52 + S_52 is seven."
      declaration: "FermatLength.lenMod_xi52"
      file: "FermatLength/Deg52.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
    - description: "The same in degree 52 modulo the larger subgroup."
      declaration: "FermatLength.lenMod_xi52_all"
      file: "FermatLength/Deg52.lean"
      comparator_config: "comparator.json"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]

fidelity:
  notes: >-
    R_d is the group of finitely supported integer functions on the nonzero residues. D_d is generated by all the pairs
    (a) + (-a) and by (d/2), as in Definition 4.4 of the paper. S_d is generated by the standard tuples of Definition 3.7 with nonzero
    entries; in degrees 44 and 52 the primes involved are 2 and 11, and 2 and 13. Definition 4.5 also asks for the orbits under the units
    modulo d, which add nothing because the set of these tuples is stable under them. xi44 is printed in Table 2 of the paper. The
    paper prints no representative of the exceptional class in degree 52; that xi52 lies in it was checked by computer
    outside Lean, and the theorems do not depend on it.

alignment:
  namespaces:
    - "FermatLength"
  statements:
