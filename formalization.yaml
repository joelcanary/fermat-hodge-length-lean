# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json

version: "v0.4"

project:
  name: "Two exceptional Hodge classes of Fermat varieties have length exactly seven (degrees 44 and 52)"
  description: >-
    Miranda, Movasati, Rufino and Villaflor (arXiv:2609.27301) reduce the Hodge conjecture for Fermat varieties to
    bounding by six the lengths of certain exceptional classes, and prove it in every degree below 65 except 44, 51
    and 52. The length of a class of degree d is the least number of nonzero residues modulo d, with multiplicity, of
    an element of the free abelian group R_d that differs from it by an element of D_d + S_d, the subgroup generated
    by the linear and by Aoki's standard tuples. Their tables give the upper bound 7 in degrees 44 and 52. This
    project proves that the length is exactly 7 for the two given seven-element representatives, so the criterion "length at
    most six" cannot be met in degrees 44 and 52 without lifting the class to a larger degree. The proof uses additive
    invariants of R_d that vanish on every generator: one for each unit t, the sum of 2 (t a mod d) - d (Shioda's
    condition), and the parity of the number of residues of order 11 (degree 44) or 13 (degree 52), which is odd on the
    representative. An exhaustive check, whose soundness is proved and which the kernel evaluates, shows that no list
    of at most six residues has those values. The same is proved modulo a larger subgroup, with more standard tuples.
    Nothing here proves or disproves the Hodge conjecture for any variety.
  authors:
    - "Joel Cruz Cabrera"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joel Cruz Cabrera"

sources:
  - title: "Lengths of Hodge characters in Fermat varieties"
    authors:
      - "Maximiliano Miranda"
      - "Hossein Movasati"
      - "Lucas Rufino"
      - "Roberto Villaflor"
    id: "https://arxiv.org/abs/2609.27301"
    type: "paper"
    location: >-
      Version 2. Definitions 3.7, 4.2, 4.4, 4.5 and 4.10, equation (29), and the rows q = 44 and q = 52 of the tables of
      Section 4, which give upper bounds.
    relationship: "adapts"
    author_endorsement: "not-contacted"
    note: >-
      The paper gives the upper bound 7 for both lengths. The lower bound proved here is not in the paper.

